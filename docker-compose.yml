version: '3.8'

networks:
  payment-network:
    driver: bridge

services:
  # ==========================================
  # 1. DATABASE POSTGRESQL MASTER (WRITE)
  # ==========================================
  postgres-master:
    image: bitnami/postgresql:15
    container_name: postgres-master
    ports:
      - "5432:5432"
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=pg_user
      - POSTGRESQL_PASSWORD=pg_password
      - POSTGRESQL_DATABASE=payment_db
    networks:
      - payment-network

  # ==========================================
  # 2. DATABASE POSTGRESQL SLAVE (READ ONLY)
  # ==========================================
  postgres-slave:
    image: bitnami/postgresql:15
    container_name: postgres-slave
    ports:
      - "5433:5432"
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=postgres-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
    depends_on:
      - postgres-master
    networks:
      - payment-network

  # ==========================================
  # 3. REDIS (CACHING & IDEMPOTENCY)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: redis-service
    ports:
      - "6379:6379"
    networks:
      - payment-network

  # ==========================================
  # 4. API GATEWAY (NGINX)
  # ==========================================
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - transaction-service
      - config-service
    networks:
      - payment-network

  # ==========================================
  # 5. NESTJS SERVICES (Sesuai package.json)
  # ==========================================

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth # Sesuai script: nest build auth
    container_name: auth-service
    environment:
      - PORT=3000
      - DB_HOST_MASTER=postgres-master
      - DB_HOST_SLAVE=postgres-slave
      - DB_PORT=5432
      - DB_USERNAME=pg_user
      - DB_PASSWORD=pg_password
      - DB_NAME=payment_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres-master
      - postgres-slave
      - redis
    networks:
      - payment-network

  # Transaction Service
  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: transaction # Sesuai script: nest build transaction
    container_name: transaction-service
    environment:
      - PORT=3000
      - DB_HOST_MASTER=postgres-master
      - DB_HOST_SLAVE=postgres-slave
      - DB_PORT=5432
      - DB_USERNAME=pg_user
      - DB_PASSWORD=pg_password
      - DB_NAME=payment_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres-master
      - postgres-slave
      - redis
    networks:
      - payment-network

  # Config Service
  config-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: config # Sesuai script: nest build config
    container_name: config-service
    environment:
      - PORT=3000
      - DB_HOST_MASTER=postgres-master
      - DB_HOST_SLAVE=postgres-slave
      - DB_PORT=5432
      - DB_USERNAME=pg_user
      - DB_PASSWORD=pg_password
      - DB_NAME=payment_db
    depends_on:
      - postgres-master
      - postgres-slave
    networks:
      - payment-network
