name: CI/CD Direct Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - transaction-service
          - settlement-recon-service
          - config-fee-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: ghcr.io/andalusia-idea/pg-backend-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Executing Remote SSH Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Updating Kubernetes Deployments with new image tags..."

            kubectl set image deployment/auth-service auth-service=ghcr.io/andalusia-idea/pg-backend-auth-service:${{ github.sha }} -n production
            kubectl set image deployment/transaction-service transaction-service=ghcr.io/andalusia-idea/pg-backend-transaction-service:${{ github.sha }} -n production
            kubectl set image deployment/settlement-recon-service settlement-recon-service=ghcr.io/andalusia-idea/pg-backend-settlement-recon-service:${{ github.sha }} -n production
            kubectl set image deployment/config-fee-service config-fee-service=ghcr.io/andalusia-idea/pg-backend-config-fee-service:${{ github.sha }} -n production

            echo "Restarting deployments completed. Verifying rollout status..."
            kubectl rollout status deployment/auth-service -n production --timeout=60s
            kubectl rollout status deployment/transaction-service -n production --timeout=60s
