name: CI/CD Pipeline Single Node (Direct Deploy)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, transaction, config]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}-service:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}-service:${{ github.sha }}

  deploy-to-server:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Memperbarui image ke tag terbaru (commit SHA) di Kubernetes klaster lokal (K3s)
            kubectl set image deployment/auth-deployment auth-service=ghcr.io/${{ github.repository_owner }}/auth-service:${{ github.sha }} -n production
            kubectl set image deployment/transaction-deployment transaction-service=ghcr.io/${{ github.repository_owner }}/transaction-service:${{ github.sha }} -n production
            kubectl set image deployment/config-deployment config-service=ghcr.io/${{ github.repository_owner }}/config-service:${{ github.sha }} -n production
