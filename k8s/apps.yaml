---
# Dashboard: tanpa listener TCP, dan tidak dirutekan ke publik.
# Lihat catatan di k8s/gateway.yaml — ia mengekspos POST /login dan seed
# membuat superadmin berpassword yang tertulis di repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-deployment
  namespace: andapay
spec:
  replicas: 1
  selector:
    matchLabels: { app: dashboard-service }
  template:
    metadata:
      labels: { app: dashboard-service }
    spec:
      serviceAccountName: andapay-app
