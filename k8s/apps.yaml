          envFrom:
            - configMapRef: { name: andapay-common }
            - secretRef:    { name: andapay-secrets }
          env:
            - { name: APP_NAME, value: "dashboard" }
            - { name: PORT,     value: "3000" }
            - name: POSTGRESQL_URL_MASTER
              valueFrom:
                secretKeyRef: { name: andapay-db, key: dashboard-master }
            - name: POSTGRESQL_URL_SLAVE
